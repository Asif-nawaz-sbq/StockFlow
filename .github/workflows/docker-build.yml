name: build and push images

# Fires on application code only. Infrastructure changes do not rebuild images,
# and an image build does not run Terraform.
on:
  push:
    branches: [staging, main]
    paths:
      - 'apps/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'apps/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY_SUFFIX: dkr.ecr.eu-central-1.amazonaws.com

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow_ci
          POSTGRES_DB: stockflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
        working-directory: apps/api

      - run: npx tsc --noEmit
        working-directory: apps/api

      - run: npm test
        working-directory: apps/api

      # The allocation and ledger suites are the ones worth gating a deploy on.
      - run: npm run test:e2e
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://stockflow:stockflow_ci@localhost:5432/stockflow_test
          TEST_REDIS_URL: redis://localhost:6379/1

  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: apps/api
          - service: web
            context: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Assume the ECR push role
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ecr-${{ github.run_id }}

      - name: Log in to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          # Pull requests build to prove the Dockerfile still works, but push
          # nothing - a fork PR has no credentials and should not have any.
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          # Only the commit SHA. The repositories are IMMUTABLE, so a moving
          # tag like :staging fails the second time it is pushed - and a
          # mutable tag would defeat the point of pinning task definitions to
          # a reproducible image in the first place.
          # On a pull request the login step is skipped, so the registry
          # output is empty and the tag would start with a bare slash, which
          # is not a parseable reference and fails the build before it starts.
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/stockflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Roll the services onto the new image
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          set -euo pipefail
          CLUSTER="stockflow-${ENVIRONMENT}-cluster"

          # Derive the registry from the caller rather than hardcoding the
          # account id, so this workflow survives being run in another account.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Nothing to deploy to until deploy_application has been turned on.
          # Exact match, not a grep: a deleted cluster lingers as INACTIVE for
          # a while, and INACTIVE contains ACTIVE, so a substring test sends
          # the deploy at a cluster that is not there any more.
          STATUS=$(aws ecs describe-clusters --clusters "$CLUSTER" \
                     --query 'clusters[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "Cluster $CLUSTER is ${STATUS} - skipping deploy."
            exit 0
          fi

          for service in api web; do
            name="stockflow-${ENVIRONMENT}-${service}"

            # Register a new revision with the new image, leaving everything
            # else in the task definition exactly as Terraform set it.
            current=$(aws ecs describe-task-definition --task-definition "$name" \
              --query 'taskDefinition' --output json)

            image="${REGISTRY}/stockflow/${service}:${{ github.sha }}"

            echo "$current" \
              | jq --arg IMAGE "$image" '
                  .containerDefinitions[0].image = $IMAGE
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy)
                ' > /tmp/${service}-taskdef.json

            revision=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/${service}-taskdef.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)

            echo "Registered $revision"

            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$name" \
              --task-definition "$revision" \
              --no-cli-pager >/dev/null
          done

          # The circuit breaker rolls back a bad image on its own; this waits
          # so a failed deploy fails the workflow rather than passing silently.
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "stockflow-${ENVIRONMENT}-api" "stockflow-${ENVIRONMENT}-web"

          echo "Both services stable on ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
