name: terraform plan

# Runs on every pull request that touches infrastructure. Read-only: this
# workflow assumes the plan role, which holds ReadOnlyAccess and nothing else,
# because a pull request from a fork can execute workflow code.
# on:
#   pull_request:
#     paths:
#       - 'infra/terraform/**'
#       - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token
  pull-requests: write   # required to post the plan as a comment

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.15.5
  TFLINT_VERSION: v0.53.0

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff
        working-directory: infra/terraform

      # No backend, no credentials: validate only needs the provider schema.
      - name: terraform validate
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          for dir in bootstrap modules/* environments/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive --format compact

      # Skips live in infra/terraform/.checkov.yml, each with a written
      # reason. Anything not listed there fails the build.
      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          config_file: infra/terraform/.checkov.yml

  plan:
    name: plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume the read-only plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      # -refresh=false on purpose.
      #
      # Refreshing reads every managed resource, including the value inside
      # aws_secretsmanager_secret_version. ReadOnlyAccess deliberately excludes
      # secretsmanager:GetSecretValue - AWS leaves it out because it reveals
      # secret material - so a refreshing plan fails here.
      #
      # The fix is not to grant the plan role that permission. This role is
      # assumable from pull requests, and a fork PR can run arbitrary workflow
      # code; a credential that can read the JWT signing keys and the Redis
      # AUTH token is exactly what must never be reachable from there.
      #
      # The cost is that a PR plan compares configuration against state rather
      # than against live infrastructure, so console drift will not show up
      # here. The apply job runs a full refresh under the apply role, which
      # does hold the permission, so drift is caught before anything is
      # applied.
      - name: terraform plan
        id: plan
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false -refresh=false \
            -var-file="${{ matrix.environment }}.tfvars" -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Trim the plan to something a comment can hold
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          # A plan can be tens of thousands of lines; a PR comment caps at 65536
          # characters. Keep the tail, which is where the summary lives.
          tail -c 55000 plan.txt > plan-trimmed.txt

      - name: Comment on the pull request
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const dir = `infra/terraform/environments/${env}`;

            // Read from disk rather than through an output variable: plan text
            // contains quotes and backslashes that do not survive being
            // interpolated into the script body.
            let plan = 'Plan output unavailable.';
            try {
              plan = fs.readFileSync(`${dir}/plan-trimmed.txt`, 'utf8');
            } catch {}

            const marker = `<!-- tf-plan:${env} -->`;
            const body = [
              marker,
              `### Terraform plan — \`${env}\``,
              '',
              process.env.OUTCOME === 'success'
                ? 'Plan completed.'
                : ':x: **Plan failed.** See the job log for the full error.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Fail if the plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
